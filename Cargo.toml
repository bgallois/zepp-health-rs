[package]
name = "zepp-health-rs"
version = "0.1.0"
edition = "2024"
authors = ["Benjamin Gallois"]
description = "A Rust client for accessing Zepp Health data"
license = "MIT"
repository = "https://github.com/bgallois/zepp-health-rs"
readme = "README.md"
keywords = ["zepp", "health", "amazfit", "api"]
categories = ["api-bindings"]

[features]
default = ["intervals"]
intervals = []

[dependencies]
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "rt-multi-thread"] }
thiserror = "2"

[dev-dependencies]
